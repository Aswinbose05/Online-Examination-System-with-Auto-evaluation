services:

  # ========================================
  # NLP Python Service
  # ========================================
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile

    container_name: exam-nlp-service

    environment:
      PORT: 5000
      DEBUG: "false"

    expose:
      - "5000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - exam-network


  # ========================================
  # Spring Boot Backend
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: exam-backend

    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/data/examdb;DB_CLOSE_DELAY=-1"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: ""

      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: "86400000"

      NLP_SERVICE_URL: "http://nlp-service:5000"

      APP_CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost,http://localhost:80,http://localhost:3000"

    ports:
      - "8080:8080"

    depends_on:
      nlp-service:
        condition: service_healthy

    volumes:
      - h2-data:/data

    networks:
      - exam-network


  # ========================================
  # Frontend + Nginx
  # ========================================
  frontend:
    image: nginx:alpine

    container_name: exam-frontend

    ports:
      - "8081:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    networks:
      - exam-network


# ========================================
# Network
# ========================================
networks:
  exam-network:
    driver: bridge


# ========================================
# Persistent H2 Database
# ========================================
volumes:
  h2-data: